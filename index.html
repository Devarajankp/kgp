    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('kgp-theme');
          if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#0B0D12';
          } else {
            document.documentElement.style.backgroundColor = '#F6F4EF';
          }
        } catch (e) {}

        var recoverKey = 'kgp-pwa-boot-recovered';
        function attemptRecovery() {
          try {
            if (sessionStorage.getItem(recoverKey) === '1') return;
            sessionStorage.setItem(recoverKey, '1');
          } catch (e) {}
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker
              .getRegistrations()
              .then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              })
              .then(function () {
                if ('caches' in window) {
                  return caches.keys().then(function (keys) {
                    return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                  });
                }
              })
              .finally(function () {
                window.location.reload();
              });
          } else {
            window.location.reload();
          }
        }

        window.addEventListener(
          'error',
          function (ev) {
            var target = ev && ev.target;
            if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
              var src = target.src || target.href || '';
              if (src.indexOf('/assets/') !== -1) {
                attemptRecovery();
              }
            }
          },
          true
        );

        window.setTimeout(function () {
          if (!window.__KGP_MOUNTED__) {
            attemptRecovery();
          }
        }, 4500);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
