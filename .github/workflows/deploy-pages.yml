name: Deploy Kerala Gold Price PWA to GitHub Pages

on:
  push:
    branches: ['main']
  schedule:
    # Poll Kerala gold sources every ~15-17 min across market hours (08:37 AM – 08:26 PM IST)
    # Staggered off :00/:15/:30/:45 to avoid GitHub Actions shared-scheduler peak delays/drops.
    - cron: '7,24,41,56 3-14 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.sync.outputs.should_deploy }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Refresh KeralaGold static PWA & API JSON snapshots
        id: sync
        continue-on-error: true
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            LIVE_URL="https://${{ github.repository_owner }}.github.io/api/latest.json?_ts=$(date +%s)"
          else
            LIVE_URL="https://${{ github.repository_owner }}.github.io/${REPO_NAME}/api/latest.json?_ts=$(date +%s)"
          fi

          OLD_SIG=""
          if curl -fsSL -H "Cache-Control: no-cache" --max-time 8 "$LIVE_URL" -o /tmp/live-latest.json; then
            OLD_SIG=$(node -e '
              const fs = require("fs");
              try {
                const d = JSON.parse(fs.readFileSync("/tmp/live-latest.json", "utf8"));
                const last = (d.entries || [])[(d.entries || []).length - 1];
                console.log([d.current?.dateLabel, d.current?.pavan22k, d.current?.gram22k, (d.entries || []).length, last?.id, d.scheduleLabel].join("|"));
              } catch {}
            ')
          fi

          npx tsx scripts/sync-static-api.ts

          NEW_SIG=$(node -e '
            const fs = require("fs");
            try {
              const d = JSON.parse(fs.readFileSync("public/api/latest.json", "utf8"));
              const last = (d.entries || [])[(d.entries || []).length - 1];
              console.log([d.current?.dateLabel, d.current?.pavan22k, d.current?.gram22k, (d.entries || []).length, last?.id, d.scheduleLabel].join("|"));
            } catch {}
          ')

          echo "Live signature: $OLD_SIG"
          echo "Fresh signature: $NEW_SIG"

          if [[ "${{ github.event_name }}" != "schedule" ]] || [[ -z "$OLD_SIG" ]] || [[ "$OLD_SIG" != "$NEW_SIG" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Rate unchanged on scheduled check; skipping redundant Pages deploy."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static PWA bundle
        if: steps.sync.outputs.should_deploy != 'false'
        run: |
          if [[ "${{ github.event.repository.name }}" == *.github.io ]]; then
            VITE_BASE_PATH="/" npm run build
          else
            VITE_BASE_PATH="/${{ github.event.repository.name }}/" npm run build
          fi

      - name: Upload GitHub Pages artifact
        if: steps.sync.outputs.should_deploy != 'false'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.should_deploy != 'false'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
